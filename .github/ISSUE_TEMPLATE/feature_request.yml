name: 功能建议 / Feature request
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述你**想做什么**，而不仅是怎么做。
        Please describe what you want to achieve, not only how to implement it.

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在什么场景下遇到了什么阻碍？
      placeholder: |
        例如：长文里有多张图时，每次要手动调整每张图的宽度。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 描述你设想的使用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案 / Alternatives
      description: 可选。

  - type: textarea
    id: context
    attributes:
      label: 补充说明 / Additional context
      description: 可选。截图、文档链接、参考实现等。

  - type: checkboxes
    id: scope
    attributes:
      label: 确认 / Confirm
      options:
        - label: |
            我已搜索过现有 issue，确认没有相同的功能建议。
            I have searched the existing issues and this is not a duplicate.
          required: true
