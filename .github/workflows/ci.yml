name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version fields in sync
        run: npm run verify:version

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # Screenshots of the three window sizes we design against. They are
  # uploaded as artifacts rather than compared pixel by pixel (a byte diff
  # would fail on font-hinting noise), so a reviewer can eyeball the change.
  # Runs against the production build, not the dev server.
  visual:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview server did not start" >&2
          exit 1

      - name: Capture baselines
        run: |
          mkdir -p shots
          for size in 1400,900 1200,800 960,600; do
            width=${size%,*}
            google-chrome \
              --headless=new --disable-gpu --hide-scrollbars --no-sandbox \
              --window-size=$size --virtual-time-budget=9000 \
              --screenshot="shots/ui-$width.png" http://127.0.0.1:4173/
          done
          ls -l shots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: ui-baselines
          path: shots/*.png
          if-no-files-found: error

      # A link in the pull request beats making a reviewer hunt through the
      # Actions tab. `--edit-last` keeps one comment per PR instead of one
      # per push; the fallback creates it the first time.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n' \
            '### UI 基线已更新' \
            '' \
            '| 视口 | 文件 |' \
            '|---|---|' \
            '| 1400×900 | shots/ui-1400.png |' \
            '| 1200×800 | shots/ui-1200.png |' \
            '| 960×600 | shots/ui-960.png |' \
            '' \
            "下载：$RUN_URL （页面底部 Artifacts → ui-baselines）" \
            '' \
            "提交：${{ github.event.pull_request.head.sha }}")
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "$body" \
            || gh pr comment ${{ github.event.pull_request.number }} --body "$body"

  # The Rust side cannot be compiled on the development machine this
  # branch came from, so the desktop shell is verified here: a full
  # `cargo check` of src-tauri. `tauri::generate_context!` embeds the
  # frontend, so `dist/` has to exist first.
  tauri-check:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
